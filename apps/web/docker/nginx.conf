server {
  listen 80;
  server_name _;

  location = /render-lab/source.pdf {
    proxy_pass https://pq-soul.rainailab.com/api/properties/320129/documents/planimetria/download;
    proxy_ssl_server_name on;
    proxy_ssl_name pq-soul.rainailab.com;
    proxy_set_header Host pq-soul.rainailab.com;
    proxy_set_header Accept application/pdf;
    proxy_hide_header Content-Disposition;
    add_header Cache-Control "private, max-age=60";
  }

  location = /api/activities/stream {
    proxy_pass http://api:3000/api/activities/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location = /api/integrations/erp/v1/studi/sync {
    client_max_body_size 64m;
    proxy_pass http://api:3000/api/integrations/erp/v1/studi/sync;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location = /site.webmanifest {
    root /usr/share/nginx/html;
    default_type application/manifest+json;
  }
}
