name: soul-pq-ordinamento

# Research only. No API, workers, host ports, or network connectivity.
services:
  postgres:
    image: postgres:17-alpine
    restart: "no"
    network_mode: none
    mem_limit: 384m
    cpus: 0.5
    environment:
      POSTGRES_DB: soul_ordinamento
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${RESEARCH_DB_PASSWORD:?Use .research/local.env}
    volumes:
      - ordinamento_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d soul_ordinamento"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  ordinamento_postgres:
