# Install as /etc/systemd/system/nginx.service.d/20-pq-recovery.conf.
# Order concurrent restarts after the local DNS resolver has signalled readiness.
# Wants avoids stopping a healthy nginx when the resolver alone is restarted.
[Unit]
Wants=systemd-resolved.service
After=systemd-resolved.service
# Keep retrying even if a temporary outage outlasts the default start limit.
StartLimitIntervalSec=0

[Service]
# Also covers ExecStartPre failures (nginx -t), including DNS lookup failures.
# An explicit systemctl stop still leaves the service stopped.
Restart=on-failure
RestartSec=10s
